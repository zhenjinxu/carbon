                          - strong [ref=e1341]: and
                          - text: there is one stable alias
                          - code [ref=e1342]: https://api.carbon.dev
                          - text: registered on whichever worktree is currently
                          - code [ref=e1343]: up
                          - text: . The stable alias exists only so OAuth callbacks have a single registered redirect URI — one Google Console entry covers every worktree. Day-to-day, your app talks to its worktree-scoped URL; only the OAuth callback hits the stable alias.
                    - listitem [ref=e1344]:
