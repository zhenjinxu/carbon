                    - listitem [ref=e1329]:
                      - text: Sign-in with Google requires a Google auth client with these variables.
                      - link "See the Supabase docs for instructions on how to set this up" [ref=e1330] [cursor=pointer]:
                        - /url: https://supabase.com/docs/guides/auth/social-login/auth-google
                      - text: ":"
                      - list [ref=e1331]:
                        - listitem [ref=e1332]:
                          - text: Set
                          - code [ref=e1333]: Authorized JavaScript origins
                          - text: to
                          - code [ref=e1334]: https://api.carbon.dev
                        - listitem [ref=e1335]:
                          - text: Set
                          - code [ref=e1336]: Authorized redirect URIs
                          - text: to
                          - code [ref=e1337]: https://api.carbon.dev/auth/v1/callback
                        - listitem [ref=e1338]:
                          - strong [ref=e1339]: "About the two API URLs you'll see:"
                          - text: each worktree has its own scoped Supabase URL (
