      - listitem "Open Carbon 功能框架.md" [ref=e127]:
        - generic [ref=e128]:
          - strong [ref=e129]: Carbon 功能框架.md
          - generic [ref=e130]: Carbon 是一个面向工业制造的一体化平台，整体围绕销售端、核心中台、工厂现场、统一存储、数据分析展开。系统通过统一 API 网关连接外部销售系统与工厂设备，对内整合 ERP、MES、QMS、WMS、MRP、CPQ 六大核心模块，形成从订单、算料、生产执行、质量管控到仓储交付的完整业务闭环。其中，MES 是装配与焊接管理的核心模块，负责 BOM 管理、工序执行、工单报工、工位控制、焊接参数采集与生产追溯；QMS 负责质量检验与缺陷追踪，WMS 负责库存与批次管理，MRP 负责物料需求与排产支撑，CPQ 负责定制化配置报价，ERP 提供企业主数据与经营基础。平台所有业务数据最终统一沉淀到 Storage 数据底座，并由 Analytics 层输出订单交付、生产进度、焊接良率、设备 OEE、缺陷分析、库存预警等 BI 看板。整体上，Carbon 的优势在于：模块解耦、前后场分离、数据统一、分析集中，适合装配制造与焊接场景下的数字化管理与扩展部署。 Carbon 项目的笔记文件为 Carbon项目.md
